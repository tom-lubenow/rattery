[package]
name = "rattery"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Write ratatui apps that run sandboxed inside the rattery host and call the backend with server_fn"

[features]
default = []
# Enable on the server build of your shared crate: server function bodies are compiled in.
ssr = ["rattery-macros/ssr", "server_fn/ssr"]
# Enable on the server build when the backend is axum.
axum = ["ssr", "rattery-macros/axum", "server_fn/axum"]

[dependencies]
rattery-macros = { workspace = true }
server_fn = { workspace = true }
ratatui = { workspace = true, features = ["std", "all-widgets", "underline-color", "macros"] }
bitflags = "2"
bytes = { workspace = true }
futures = { workspace = true }
http = { workspace = true }

[target.'cfg(target_os = "wasi")'.dependencies]
wit-bindgen = "0.57"
wasip2 = "1.0"
wstd = "0.6"
send_wrapper = { version = "0.6", features = ["futures"] }
http-body-util = "0.1"
