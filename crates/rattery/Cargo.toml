[package]
name = "rattery"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["ratatui", "tui", "wasm", "wasi", "sandbox"]
categories = ["command-line-interface", "wasm"]
description = "rattery: a sandboxed terminal host that runs ratatui apps delivered over HTTP, as a CLI and as a library"

[dependencies]
anyhow = { workspace = true }
async-trait = "0.1"
cookie_store = { version = "0.22", default-features = false, features = ["serde_json"] }
directories = "6"
crossterm = { version = "0.29", features = ["event-stream", "bracketed-paste"] }
futures = { workspace = true }
http = { workspace = true }
http-body-util = "0.1"
ratatui = { workspace = true, features = ["std", "crossterm_0_29", "underline-color"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
tokio = { workspace = true, features = ["fs", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
url = "2"
wasmtime = { version = "48", features = ["component-model-async"] }
wasmtime-wasi = { version = "48", features = ["p3"] }
wasmtime-wasi-http = { version = "48", features = ["p3"] }

[dev-dependencies]
tokio = { workspace = true, features = ["process", "io-util"] }
