[package]
name = "rattery-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["ratatui", "server_fn", "proc-macro"]
categories = ["command-line-interface"]
description = "Proc macros for rattery-app: the #[rattery_app::server] attribute"

[lib]
proc-macro = true

[features]
default = []
ssr = ["server_fn_macro/ssr"]
axum = ["ssr", "server_fn_macro/axum"]

[dependencies]
server_fn_macro = { workspace = true }
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
