[workspace]
resolver = "3"
members = [
    "crates/rattery",
    "crates/rattery-macros",
    "crates/rattery-host",
    "examples/counter/shared",
    "examples/counter/app",
    "examples/counter/server",
    "examples/spin",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/tom-lubenow/rattery"

[workspace.dependencies]
rattery = { path = "crates/rattery", version = "0.1.0" }
rattery-macros = { path = "crates/rattery-macros", version = "0.1.0" }
ratatui = { version = "0.30", default-features = false }
server_fn = { version = "0.8", default-features = false }
server_fn_macro = { version = "0.8", default-features = false }
anyhow = "1"
bytes = "1"
futures = "0.3"
http = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

[profile.release]
lto = true
codegen-units = 1
