[workspace]
resolver = "3"
members = [
    "crates/rattery",
    "crates/rattery-app",
    "crates/rattery-build",
    "crates/rattery-macros",
    "examples/counter/shared",
    "examples/counter/app",
    "examples/counter/server",
    "examples/spin",
    "examples/bench",
    "examples/rattery-cli",
    "xtask",
]

[workspace.package]
version = "0.3.3"
edition = "2024"
license = "MIT"
repository = "https://github.com/tom-lubenow/rattery"

[workspace.dependencies]
rattery = { path = "crates/rattery", version = "0.3.3" }
rattery-app = { path = "crates/rattery-app", version = "0.3.3" }
rattery-build = { path = "crates/rattery-build", version = "0.3.3" }
rattery-macros = { path = "crates/rattery-macros", version = "0.3.3" }
ratatui = { version = "0.30", default-features = false }
server_fn = { version = "0.8", default-features = false }
server_fn_macro = { version = "0.8", default-features = false }
anyhow = "1"
bytes = "1"
futures = "0.3"
http = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

# Dev builds of apps stay unoptimised for fast iteration, but their
# dependencies (ratatui, the wasm runtime glue) are optimised: that is where
# the time goes in a frame, and it cuts the debug component's size and
# compile time as well.
[profile.dev.package."*"]
opt-level = 2
